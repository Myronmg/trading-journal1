<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Trading Journal</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Journal">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0B0D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#0A0B0D; --card:#121419; --card2:#171A21; --border:#232732;
  --text:#E7EAF0; --muted:#79808F; --green:#22C55E; --red:#F0435A; --gold:#E3B341;
  --tabbg:rgba(18,20,25,.94); --radar:#C9D1E0; --body:#B6BDCB;
  --greenrgb:34,197,94; --redrgb:240,67,90;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#F5F6F8; --card:#FFFFFF; --card2:#EFF1F5; --border:#DFE3EA;
    --text:#12151A; --muted:#666E7C; --green:#12A150; --red:#D42B4E; --gold:#9A6E0A;
    --tabbg:rgba(255,255,255,.94); --radar:#8A93A5; --body:#3A414C;
    --greenrgb:18,161,80; --redrgb:212,43,78;
    color-scheme:light;
  }
  .card,.hero,.trade,.ticker,.pill,.tabs{box-shadow:0 1px 2px rgba(16,24,40,.05)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 96px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px}
.lbl{font-size:11px;color:var(--muted);margin-bottom:6px}
.sm{font-size:12px} .muted{color:var(--muted)}
.green{color:var(--green)} .red{color:var(--red)} .gold{color:var(--gold)}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}.gl2{grid-template-columns:repeat(2,1fr)}}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--border)}
button{font-family:inherit;cursor:pointer}
.hello{font-size:20px;font-weight:600;letter-spacing:-.01em;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:99px;display:inline-block;margin-right:5px}
.ticker{margin:12px 0 14px;padding:12px 14px;border-radius:14px;background:var(--card);
  border:1px solid var(--border);overflow:hidden;position:relative;min-height:56px;display:flex;align-items:center}
.ticker .item{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;position:absolute;
  left:14px;right:46px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ticker .item.on{opacity:1;transform:none}
.ticker .k{font-size:12px;color:var(--muted)}
.ticker .v{font-size:19px}
.pips{position:absolute;right:12px;display:flex;gap:4px}
.pips i{width:4px;height:4px;border-radius:99px;background:var(--border);display:block}
.pips i.on{background:var(--muted)}
.hero{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:18px;padding:16px;margin-bottom:10px}
.hero .big{font-size:34px;letter-spacing:-.02em;line-height:1.1}
.pill{display:flex;gap:4px;padding:4px;border-radius:12px;background:var(--card);border:1px solid var(--border);margin-bottom:10px;overflow-x:auto}
.pill button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;padding:8px 10px;border-radius:9px;white-space:nowrap}
.pill button.on{background:var(--card2);color:var(--text)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;padding:5px;border-radius:16px;background:var(--tabbg);
  border:1px solid var(--border);backdrop-filter:blur(12px);z-index:20}
.tab{border:0;background:transparent;color:var(--muted);font-size:12px;padding:9px 13px;border-radius:11px}
.tab.on{background:var(--card2);color:var(--text)}
.chip{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--border);color:var(--muted);background:transparent;display:inline-block}
.chip.on-bad{border-color:var(--red);color:var(--red)}
.chip.on-good{border-color:var(--green);color:var(--green)}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px;font-size:15px;font-family:inherit;outline:none}
textarea{resize:none}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:9px 4px;font-size:12px}
.seg button.on{background:var(--card2);color:var(--text)}
.field{margin-bottom:12px}
.trade{background:var(--card);border:1px solid var(--border);border-left-width:3px;border-radius:16px;padding:14px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px}
.bar{height:4px;border-radius:99px;background:var(--card2);overflow:hidden;margin:5px 0}
.bar>i{display:block;height:100%;border-radius:99px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{min-height:46px;border-radius:9px;background:var(--card2);border:1px solid transparent;padding:4px;display:flex;flex-direction:column;justify-content:space-between}
.cell b{font-size:11px;color:var(--muted);font-weight:400}
.check{width:21px;height:21px;border-radius:7px;border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--bg)}
.check.on{background:var(--green);border-color:var(--green)}
.rule{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:14px;color:var(--muted);background:transparent;border:0;width:100%;text-align:left}
.rule.on{color:var(--text)}
.btn{border-radius:10px;padding:10px 14px;font-size:13px;border:1px solid var(--border);background:transparent;color:var(--muted)}
.btn.primary{background:var(--green);color:var(--bg);border-color:var(--green);font-weight:600}
.btn.primary:disabled{background:var(--card2);color:var(--muted);border-color:var(--border)}
.note{display:flex;gap:8px;font-size:12px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.shots{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;padding-bottom:2px}
.shotbox{position:relative;flex:0 0 auto}
.shot{display:block;height:84px;width:auto;max-width:160px;min-width:84px;object-fit:cover;border-radius:10px;border:1px solid var(--border);background:var(--card2);cursor:zoom-in}
img.shot:not([src]){width:120px}
.shot.missing{opacity:.35;cursor:default}
.shotbox .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:99px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:0}
.addshot{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:84px;min-width:120px;padding:0 12px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);font-size:12px;cursor:pointer;text-align:center;flex:0 0 auto}
.addshot b{font-size:20px;font-weight:400;line-height:1}
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:flex}
#lightbox[hidden]{display:none}
.lb-scroll{flex:1;overflow:auto;display:flex;padding:calc(env(safe-area-inset-top) + 56px) 10px calc(env(safe-area-inset-bottom) + 20px)}
#lbimg{margin:auto;max-width:100%;max-height:100%;border-radius:8px;cursor:zoom-in}
#lbimg.zoom{max-width:none;max-height:none;cursor:zoom-out}
.lb-close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:14px;width:38px;height:38px;border-radius:99px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:15px;z-index:2}
pre{background:var(--card2);padding:12px;border-radius:10px;overflow-x:auto;font-size:11px;line-height:1.5;margin:0}
@media (prefers-reduced-motion:reduce){.ticker .item{transition:none}}

:root[data-theme="light"]{
    --bg:#F5F6F8; --card:#FFFFFF; --card2:#EFF1F5; --border:#DFE3EA;
    --text:#12151A; --muted:#666E7C; --green:#12A150; --red:#D42B4E; --gold:#9A6E0A;
    --tabbg:rgba(255,255,255,.94); --radar:#8A93A5; --body:#3A414C;
    --greenrgb:18,161,80; --redrgb:212,43,78;
    color-scheme:light;
}
:root[data-theme="light"] .card,:root[data-theme="light"] .hero,:root[data-theme="light"] .trade,:root[data-theme="light"] .ticker,:root[data-theme="light"] .pill,:root[data-theme="light"] .tabs{box-shadow:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme="dark"]{
    --bg:#0A0B0D; --card:#121419; --card2:#171A21; --border:#232732;
    --text:#E7EAF0; --muted:#79808F; --green:#22C55E; --red:#F0435A; --gold:#E3B341;
    --tabbg:rgba(18,20,25,.94); --radar:#C9D1E0; --body:#B6BDCB;
    --greenrgb:34,197,94; --redrgb:240,67,90;
    color-scheme:dark;
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tabs" id="tabs"></div>
<div id="lightbox" hidden><button class="lb-close" data-action="closeShot" aria-label="Schließen">✕</button><div class="lb-scroll" data-action="closeShot"><img id="lbimg" data-action="zoomShot" alt="Screenshot"></div></div>

<script>
const KEY="fundedbook:v1";
const SESSIONS=["Asia","London","NY AM","NY PM"];
const GRADES=["A+","A","B","C","D"];
const GRADE_COLOR={"A+":"var(--gold)","A":"var(--gold)","B":"#7FB3FF","C":"var(--muted)","D":"var(--red)"};
const TAGS=["FOMO Entry","Chased","Revenge Trade","Zu früh raus","Zu spät Entry","SL verschoben","News gehandelt","Overtrading","Perfekte Ausführung"];
const WEEKDAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

const usd=(n,d=2)=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const clamp=n=>Math.max(0,Math.min(100,n));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const deDate=iso=>{const p=iso.split("-");return p[2]+"."+p[1]+"."+p[0];};
const todayISO=()=>new Date().toISOString().slice(0,10);

let S={trades:[],startBalance:600000,name:"Myron",theme:"auto",view:"dash",chart:"kurve",month:new Date(),filter:"all",updatedAt:0};
let draft=null, tickerIdx=0, tickerTimer=null;

/* ---------- speicher ---------- */
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);
    S.trades=s.trades||[];S.startBalance=s.startBalance??600000;S.name=s.name||"Myron";S.theme=s.theme||"auto";S.updatedAt=s.updatedAt||0;}}catch(e){}
  try{localStorage.removeItem("fundedbook:sync");localStorage.removeItem("fundedbook:shotq");}catch(e){}
}
function save(touch){
  if(touch!==false)S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify({trades:S.trades,startBalance:S.startBalance,name:S.name,theme:S.theme,updatedAt:S.updatedAt}));}catch(e){}
}
function applyTheme(){
  if(S.theme==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",S.theme);
}

/* ---------- screenshots ---------- */
let SHOTS={}, INFLIGHT={};
const IDB=(function(){
  let dbp=null;
  function db(){if(!dbp)dbp=new Promise(function(res,rej){const r=indexedDB.open("fundedbook-shots",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("shots");};
    r.onsuccess=function(){res(r.result);};r.onerror=function(){rej(r.error);};});return dbp;}
  function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){
    const t=d.transaction("shots",mode),q=fn(t.objectStore("shots"));
    t.oncomplete=function(){res(q?q.result:undefined);};t.onerror=function(){rej(t.error);};});});}
  return{get:k=>tx("readonly",s=>s.get(k)),set:(k,v)=>tx("readwrite",s=>s.put(v,k)),del:k=>tx("readwrite",s=>s.delete(k))};
})();
function newShotId(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function compressImage(file){
  return new Promise(function(res,rej){
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      const max=1800,s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8));};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("Bild konnte nicht gelesen werden."));};
    img.src=url;
  });
}
async function addFiles(files){
  if(!draft)return;
  for(const f of files){
    if(!f||!/^image\//.test(f.type||"image/"))continue;
    try{const data=await compressImage(f),id=newShotId();SHOTS[id]=data;draft.shots.push(id);}
    catch(e){alert(e.message);}
  }
  if(S.view==="new"){render();startTicker();}
}
function getShot(id){
  if(SHOTS[id])return Promise.resolve(SHOTS[id]);
  if(INFLIGHT[id])return INFLIGHT[id];
  INFLIGHT[id]=(async function(){
    let d=null;
    try{d=await IDB.get(id);}catch(e){}
    if(d)SHOTS[id]=d;
    return d;
  })().finally(function(){delete INFLIGHT[id];});
  return INFLIGHT[id];
}
function hydrateShots(){
  document.querySelectorAll("img[data-shot]:not([src])").forEach(function(img){
    getShot(img.dataset.shot).then(function(d){if(d)img.src=d;else img.classList.add("missing");});
  });
}
function deleteShots(ids){
  (ids||[]).forEach(function(id){
    delete SHOTS[id];IDB.del(id).catch(function(){});
  });
}
async function exportData(){
  const shots={};
  for(const t of S.trades)for(const id of (t.shots||[])){const d=await getShot(id);if(d)shots[id]=d;}
  const blob=new Blob([JSON.stringify({trades:S.trades,startBalance:S.startBalance,name:S.name,shots:shots})],{type:"application/json"});
  const url=URL.createObjectURL(blob),link=document.createElement("a");
  link.href=url;link.download="journal-backup-"+todayISO()+".json";document.body.appendChild(link);link.click();link.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},4000);
}
function shotImg(id){
  return '<img class="shot" data-shot="'+esc(id)+'" data-action="openShot" data-v="'+esc(id)+'" alt="Screenshot"'+(SHOTS[id]?' src="'+SHOTS[id]+'"':'')+'>';
}
function openShot(id){
  const lb=document.getElementById("lightbox"),img=document.getElementById("lbimg");
  img.classList.remove("zoom");img.removeAttribute("src");lb.hidden=false;
  getShot(id).then(function(d){if(d)img.src=d;});
}

/* ---------- kennzahlen ---------- */
function metrics(){
  const t=S.trades.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);
  const wins=t.filter(x=>x.pnl>0),losses=t.filter(x=>x.pnl<0);
  const net=t.reduce((s,x)=>s+x.pnl,0);
  const gp=wins.reduce((s,x)=>s+x.pnl,0),gl=Math.abs(losses.reduce((s,x)=>s+x.pnl,0));
  const avgWin=wins.length?gp/wins.length:0,avgLoss=losses.length?gl/losses.length:0;
  const pf=gl>0?gp/gl:(gp>0?99:0), wl=avgLoss>0?avgWin/avgLoss:(avgWin>0?99:0);
  const dayMap=new Map();t.forEach(x=>dayMap.set(x.date,(dayMap.get(x.date)||0)+x.pnl));
  const days=Array.from(dayMap.entries()).sort((a,b)=>a[0].localeCompare(b[0]));
  const dayWin=days.length?days.filter(d=>d[1]>0).length/days.length*100:0;
  let run=0,peak=0,maxDD=0;
  const curve=days.map(d=>{run+=d[1];peak=Math.max(peak,run);maxDD=Math.max(maxDD,peak-run);return{date:d[0],day:d[1],cum:run};});
  const vals=days.map(d=>d[1]);
  const mean=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const sd=vals.length?Math.sqrt(vals.reduce((s,v)=>s+Math.pow(v-mean,2),0)/vals.length):0;
  const cv=Math.abs(mean)>0?sd/Math.abs(mean):2;
  const rf=maxDD>0?net/maxDD:(net>0?5:0);
  let streak=0;for(let i=t.length-1;i>=0;i--){if(t[i].plan)streak++;else break;}
  const adherence=t.length?t.filter(x=>x.plan).length/t.length*100:0;
  const edge={"Trefferquote":clamp(wins.length/(t.length||1)*100*1.6),"Profit-Faktor":clamp(pf/3*100),
    "Ø G/V":clamp(wl/2*100),"Erholung":clamp(rf/5*100),
    "Max. DD":clamp(100-maxDD/(S.startBalance*0.08||1)*100),"Konstanz":clamp(100-cv*45)};
  const edgeScore=Object.keys(edge).reduce((a,k)=>a+edge[k],0)/6;
  const since=new Date();since.setDate(since.getDate()-7);
  const week=t.filter(x=>new Date(x.date)>=since);
  return{t:t,net:net,winRate:t.length?wins.length/t.length*100:0,pf:pf,avgWin:avgWin,avgLoss:avgLoss,
    dayWin:dayWin,curve:curve,maxDD:maxDD,streak:streak,adherence:adherence,edge:edge,edgeScore:edgeScore,
    dayMap:dayMap,tradeDays:days.length,week:week,weekNet:week.reduce((s,x)=>s+x.pnl,0)};
}
function groupStats(trades,keyFn){
  const map=new Map();
  trades.forEach(t=>{const k=keyFn(t)||"—";if(!map.has(k))map.set(k,[]);map.get(k).push(t);});
  return Array.from(map.entries()).map(e=>{
    const list=e[1],net=list.reduce((s,t)=>s+t.pnl,0),wins=list.filter(t=>t.pnl>0);
    const gp=wins.reduce((s,t)=>s+t.pnl,0),gl=Math.abs(list.filter(t=>t.pnl<0).reduce((s,t)=>s+t.pnl,0));
    return{k:e[0],n:list.length,net:net,wr:wins.length/list.length*100,pf:gl>0?gp/gl:(gp>0?99:0)};
  }).sort((a,b)=>b.net-a.net);
}

/* ---------- charts ---------- */
function areaChart(curve,h){
  h=h||190;
  if(curve.length<2)return '<div class="sm muted" style="padding:40px 0;text-align:center">Zu wenig Daten für die Kurve.</div>';
  const W=600,H=200,P=8;
  const ys=curve.map(d=>d.cum),min=Math.min.apply(null,[0].concat(ys)),max=Math.max.apply(null,[0].concat(ys)),span=(max-min)||1;
  const x=i=>P+i*(W-2*P)/(curve.length-1), y=v=>H-P-(v-min)/span*(H-2*P);
  const line=curve.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(d.cum).toFixed(1)).join("");
  const fill=line+"L"+x(curve.length-1).toFixed(1)+","+y(min)+"L"+x(0)+","+y(min)+"Z";
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+h+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="eq" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" style="stop-color:var(--green)" stop-opacity=".35"/><stop offset="100%" style="stop-color:var(--green)" stop-opacity="0"/></linearGradient></defs>'+
    '<path d="'+fill+'" fill="url(#eq)"/><path d="'+line+'" fill="none" style="stroke:var(--green)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>';
}
function sparkline(curve){
  if(curve.length<2)return "";
  const W=300,H=44;
  const ys=curve.map(d=>d.cum),min=Math.min.apply(null,ys),max=Math.max.apply(null,ys),span=(max-min)||1;
  const pts=curve.map((d,i)=>(i*W/(curve.length-1)).toFixed(1)+","+(H-4-(d.cum-min)/span*(H-8)).toFixed(1)).join(" ");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="44" preserveAspectRatio="none" style="margin-top:8px">'+
    '<polyline points="'+pts+'" fill="none" style="stroke:var(--green)" stroke-width="1.5" vector-effect="non-scaling-stroke" opacity=".85"/></svg>';
}
function barsChart(curve){
  if(!curve.length)return '<div class="sm muted" style="padding:40px 0;text-align:center">Noch keine Handelstage.</div>';
  const W=600,H=170,P=6,max=Math.max.apply(null,curve.map(d=>Math.abs(d.day)).concat([1])),bw=(W-2*P)/curve.length,zero=H/2;
  const bars=curve.map((d,i)=>{const hh=Math.abs(d.day)/max*(H/2-P);
    return '<rect x="'+(P+i*bw+bw*.2).toFixed(1)+'" y="'+(d.day>=0?zero-hh:zero).toFixed(1)+'" width="'+(bw*.6).toFixed(1)+
      '" height="'+Math.max(hh,1).toFixed(1)+'" rx="2" style="fill:'+(d.day>=0?"var(--green)":"var(--red)")+'"/>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="160" preserveAspectRatio="none">'+
    '<line x1="0" y1="'+zero+'" x2="'+W+'" y2="'+zero+'" style="stroke:var(--border)"/>'+bars+'</svg>';
}
function radarChart(edge){
  const keys=Object.keys(edge),N=keys.length,R=64,cx=110,cy=92;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  const rings=[.33,.66,1].map(f=>'<polygon points="'+keys.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(",")).join(" ")+'" fill="none" style="stroke:var(--border)"/>').join("");
  const shape=keys.map((k,i)=>pt(i,R*edge[k]/100).map(n=>n.toFixed(1)).join(",")).join(" ");
  const labels=keys.map((k,i)=>{const p=pt(i,R+16);
    return '<text x="'+p[0].toFixed(1)+'" y="'+(p[1]+3).toFixed(1)+'" style="fill:var(--muted)" font-size="8.5" text-anchor="'+
      (p[0]>cx+4?"start":p[0]<cx-4?"end":"middle")+'">'+k+'</text>';}).join("");
  return '<svg viewBox="0 0 220 184" width="100%" height="188">'+rings+
    '<polygon points="'+shape+'" style="fill:var(--radar);stroke:var(--radar)" fill-opacity=".22" stroke-width="1.5"/>'+labels+'</svg>';
}

/* ---------- ticker ---------- */
function tickerItems(m){
  const it=[];
  it.push(["Netto-Gewinn",usd(m.net,0),m.net>=0?"var(--green)":"var(--red)"]);
  it.push(["Kontostand",usd(S.startBalance+m.net,0),null]);
  if(m.t.length){
    it.push(["Trefferquote",m.winRate.toFixed(1)+" %",null]);
    it.push(["Profit-Faktor",m.pf>=99?"∞":m.pf.toFixed(2),m.pf>=1.5?"var(--green)":null]);
    it.push(["Edge-Score",m.edgeScore.toFixed(1),null]);
    it.push(["Am Plan in Folge",m.streak+" Trades",m.streak>=3?"var(--green)":null]);
    it.push(["Max. Drawdown",usd(-m.maxDD,0),"var(--red)"]);
    const best=groupStats(m.t,t=>t.model)[0];
    if(best)it.push(["Bestes Setup",best.k+" · "+usd(best.net,0),best.net>=0?"var(--green)":"var(--red)"]);
    const worst=TAGS.map(tag=>{const l=m.t.filter(t=>t.tags.indexOf(tag)>=0);
      return{tag:tag,net:l.reduce((s,t)=>s+t.pnl,0),n:l.length};}).filter(r=>r.n&&r.net<0).sort((a,b)=>a.net-b.net)[0];
    if(worst)it.push(["Teuerster Fehler",worst.tag+" · "+usd(worst.net,0),"var(--red)"]);
    it.push(["Letzte 7 Tage",m.week.length+" Trades · "+usd(m.weekNet,0),m.weekNet>=0?"var(--green)":"var(--red)"]);
    const last=m.t[m.t.length-1];
    it.push(["Letzter Trade",last.symbol+" "+usd(last.pnl,0),last.pnl>=0?"var(--green)":"var(--red)"]);
  }
  return it;
}
function renderTicker(m){
  const items=tickerItems(m);
  return '<div class="ticker" id="ticker" data-count="'+items.length+'">'+
    items.map((x,i)=>'<div class="item '+(i===0?"on":"")+'" data-i="'+i+'">'+
      '<span class="k">'+x[0]+'</span><span class="v mono" style="color:'+(x[2]||"var(--text)")+'">'+x[1]+'</span></div>').join("")+
    '<div class="pips">'+items.map((_,i)=>'<i class="'+(i===0?"on":"")+'" data-p="'+i+'"></i>').join("")+'</div></div>';
}
function startTicker(){
  clearInterval(tickerTimer);
  tickerTimer=setInterval(function(){
    const el=document.getElementById("ticker");if(!el)return;
    const n=+el.dataset.count;if(!n)return;
    tickerIdx=(tickerIdx+1)%n;
    el.querySelectorAll(".item").forEach(d=>d.classList.toggle("on",+d.dataset.i===tickerIdx));
    el.querySelectorAll(".pips i").forEach(d=>d.classList.toggle("on",+d.dataset.p===tickerIdx));
  },4000);
}

  sparkline(m.curve)+'</div>'+

    mini("Trefferquote",m.winRate.toFixed(1)+" %")+
    mini("Profit-Faktor",m.pf>=99?"∞":m.pf.toFixed(2),m.pf>=1.5?"var(--green)":null)+

  '<div class="pill">'+[["kurve","Kurve"],["tage","Tage"],["kalender","Kalender"],["edge","Edge"]]
    .map(p=>'<button data-action="chart" data-v="'+p[0]+'" class="'+(S.chart===p[0]?"on":"")+'">'+p[1]+'</button>').join("")+'</div>'+
  '<div class="card" style="margin-bottom:10px">'+charts[S.chart]+'</div>'+

    (m.t.slice(-5).reverse().map(t=>'<div class="row">'+

      '<span class="sm muted">'+esc(t.session)+'</span>'+
      '<span class="sm mono" style="color:'+(t.pnl>=0?"var(--green)":"var(--red)")+'">'+usd(t.pnl,0)+'</span></div>').join("")
      ||'<div class="sm muted" style="padding:14px 0">Noch keine Trades. Tipp unten auf „+ Trade".</div>')+'</div>';
}

function calendarInner(m){
  const y=S.month.getFullYear(),mo=S.month.getMonth();
  const offset=(new Date(y,mo,1).getDay()+6)%7,n=new Date(y,mo+1,0).getDate();
  const key=d=>y+"-"+String(mo+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
  let cells="";
  for(let i=0;i<offset;i++)cells+="<div></div>";
  for(let d=1;d<=n;d++){
    const v=m.dayMap.get(key(d)),has=v!==undefined,up=has&&v>=0;
    const cnt=has?m.t.filter(t=>t.date===key(d)).length:0;
    cells+='<div class="cell" style="'+(has?"background:rgba("+(up?"var(--greenrgb)":"var(--redrgb)")+",.10);border-color:rgba("+(up?"var(--greenrgb)":"var(--redrgb)")+",.35)":"")+'">'+
      '<b>'+d+'</b>'+(has?'<div><div class="mono" style="font-size:9.5px;color:'+(up?"var(--green)":"var(--red)")+'">'+usd(v,0)+'</div>'+
      '<div style="font-size:8.5px;color:var(--muted)">'+cnt+' T</div></div>':"")+'</div>';
  }
  return '<div style="display:flex;justify-content:space-between;align-items:center">'+
    '<div class="lbl">'+S.month.toLocaleDateString("de-DE",{month:"long",year:"numeric"})+'</div>'+
    '<div><button class="btn" style="padding:3px 10px" data-action="prevMonth">‹</button>'+
    '<button class="btn" style="padding:3px 10px" data-action="nextMonth">›</button></div></div>'+
    '<div class="cal sm muted" style="text-align:center;margin-bottom:4px">'+["Mo","Di","Mi","Do","Fr","Sa","So"].map(d=>"<div>"+d+"</div>").join("")+'</div>'+
    '<div class="cal">'+cells+'</div>';
}

function viewAnalyse(m){
  const clean=m.t.filter(t=>t.plan&&!t.tags.some(x=>x!=="Perfekte Ausführung"));
  const dirty=m.t.filter(t=>clean.indexOf(t)<0);
  const cleanNet=clean.reduce((s,t)=>s+t.pnl,0),dirtyNet=dirty.reduce((s,t)=>s+t.pnl,0);
  const table=function(title,rows,hint){
    const max=Math.max.apply(null,rows.map(r=>Math.abs(r.net)).concat([1]));
    return '<div class="card"><div class="lbl">'+title+'</div>'+(hint?'<div class="sm muted" style="margin-bottom:6px">'+hint+'</div>':"")+
      (rows.map(r=>'<div style="padding:8px 0;border-top:1px solid var(--border)">'+
        '<div style="display:flex;justify-content:space-between;gap:8px"><span class="sm">'+esc(r.k)+'</span>'+
        '<span class="mono sm" style="color:'+(r.net>=0?"var(--green)":"var(--red)")+'">'+usd(r.net,0)+'</span></div>'+
        '<div class="bar"><i style="width:'+(Math.abs(r.net)/max*100)+'%;background:'+(r.net>=0?"var(--green)":"var(--red)")+'"></i></div>'+
        '<div class="sm muted" style="display:flex;gap:12px"><span>'+r.n+' Trades</span><span>'+r.wr.toFixed(0)+' % Treffer</span><span>PF '+(r.pf>=99?"∞":r.pf.toFixed(2))+'</span></div>'+
      '</div>').join("")||'<div class="sm muted" style="padding:14px 0">Noch keine Daten.</div>')+'</div>';};
  const tagRows=TAGS.map(tag=>{const l=m.t.filter(t=>t.tags.indexOf(tag)>=0);
    return{tag:tag,n:l.length,net:l.reduce((s,t)=>s+t.pnl,0)};}).filter(r=>r.n>0).sort((a,b)=>a.net-b.net);
  return '<div class="card" style="margin-bottom:10px"><div class="lbl">Was Disziplin dich wert ist</div>'+
    '<div class="grid g2" style="margin-top:6px">'+
      '<div><div class="sm muted">Regelkonform</div><div class="mono" style="font-size:20px;color:'+(cleanNet>=0?"var(--green)":"var(--red)")+'">'+usd(cleanNet,0)+'</div><div class="sm muted">'+clean.length+' Trades</div></div>'+
      '<div><div class="sm muted">Mit Fehler</div><div class="mono" style="font-size:20px;color:'+(dirtyNet>=0?"var(--green)":"var(--red)")+'">'+usd(dirtyNet,0)+'</div><div class="sm muted">'+dirty.length+' Trades</div></div></div>'+
    (dirty.length&&dirtyNet<0?'<div class="note"><span class="gold">⚠</span><span>Deine Fehler-Trades kosten dich '+usd(Math.abs(dirtyNet),0)+'. Ohne sie stündest du bei '+usd(cleanNet,0)+'.</span></div>':"")+'</div>'+
  '<div class="grid gl2" style="margin-bottom:10px">'+
    table("Nach Setup / Modell",groupStats(m.t,t=>t.model),"Welches Modell wirklich Geld verdient.")+
    table("Nach Session",groupStats(m.t,t=>t.session))+
    table("Nach Symbol",groupStats(m.t,t=>t.symbol))+
    table("Nach Wochentag",groupStats(m.t,t=>WEEKDAYS[new Date(t.date).getDay()]))+'</div>'+
  '<div class="card"><div class="lbl">Was die einzelnen Fehler kosten</div>'+
    (tagRows.map(r=>'<div class="row"><span class="sm">'+r.tag+'</span>'+
      '<span><span class="sm muted" style="margin-right:12px">'+r.n+'×</span>'+
      '<span class="mono sm" style="color:'+(r.net>=0?"var(--green)":"var(--red)")+'">'+usd(r.net,0)+'</span></span></div>').join("")
      ||'<div class="sm muted" style="padding:14px 0">Noch keine Tags vergeben.</div>')+'</div>';
}

    ||'<div class="card sm muted" style="text-align:center;padding:26px">Keine Trades in dieser Ansicht.</div>');

document.addEventListener("click",function(e){
  const el=e.target.closest("[data-action]");if(!el)return;
  const a=el.dataset.action,v=el.dataset.v;
  if(a==="view"){S.view=v;if(v==="new")draft=null;tickerIdx=0;}
  else if(a==="theme"){S.theme=v;save();applyTheme();}
  else if(a==="chart")S.chart=v;
  else if(a==="filter")S.filter=v;
  else if(a==="prevMonth")S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);
  else if(a==="nextMonth")S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);
  else if(a==="del"){const tr=S.trades.find(t=>String(t.id)===v);if(tr)deleteShots(tr.shots);
    S.trades=S.trades.filter(t=>String(t.id)!==v);save();}
  else if(a==="openShot"){openShot(v);return;}
  else if(a==="zoomShot"){el.classList.toggle("zoom");return;}
  else if(a==="closeShot"){document.getElementById("lightbox").hidden=true;return;}
  else if(a==="plan")draft.plan=v==="1";
  else if(a==="rmShot"){draft.shots=draft.shots.filter(x=>x!==v);delete SHOTS[v];}
  else if(a==="set")draft[el.dataset.k]=v;
  else if(a==="tag")draft.tags=draft.tags.indexOf(v)>=0?draft.tags.filter(x=>x!==v):draft.tags.concat([v]);
  else if(a==="cancel"){if(draft)draft.shots.forEach(id=>{delete SHOTS[id];});draft=null;S.view="dash";}
  else if(a==="saveTrade"){
    const shots=draft.shots.slice();
    shots.forEach(function(id){IDB.set(id,SHOTS[id]).catch(function(){alert("Screenshot konnte nicht gespeichert werden.");});});
    S.trades.push(Object.assign({},draft,{id:Date.now(),plan:draft.plan!==false,shots:shots,
      pnl:Number(draft.pnl),r:draft.r===""?null:Number(draft.r),
      model:draft.model||"Kein Modell",why:draft.why||"Keine Notiz hinterlegt."}));
    save();draft=null;S.view="journal";}
  else if(a==="export"){exportData();return;}
  else if(a==="import"){document.getElementById("importer").click();return;}
  else if(a==="reset"){
    if(el.dataset.armed){S.trades.forEach(t=>deleteShots(t.shots));S.trades=[];save();}
    else{el.dataset.armed="1";el.textContent="Wirklich alles löschen?";el.style.color="var(--red)";el.style.borderColor="var(--red)";return;}}
  render();startTicker();
});

document.addEventListener("input",function(e){
  const el=e.target.closest("[data-field]");if(!el)return;
  const f=el.dataset.field,v=el.value;
  if(f==="startBalance"){S.startBalance=Number(v)||0;save();return;}
  if(f==="name"){S.name=v;save();return;}
  if(draft)draft[f]=v;
});
document.addEventListener("change",function(e){
  const el=e.target.closest("[data-field]");if(!el)return;
  if(el.dataset.field==="startBalance"){render();startTicker();}
  if(el.dataset.field==="date"&&draft){draft.date=el.value;render();startTicker();}
});

document.addEventListener("change",function(e){
  if(e.target.id!=="shotpicker")return;
  const files=Array.from(e.target.files||[]);e.target.value="";addFiles(files);
});
document.addEventListener("paste",function(e){
  if(S.view!=="new"||!draft||!e.clipboardData)return;
  const files=Array.from(e.clipboardData.items||[]).filter(i=>i.type.indexOf("image/")===0).map(i=>i.getAsFile());
  if(!files.length)return;
  e.preventDefault();addFiles(files);
});
document.addEventListener("dragover",function(e){if(S.view==="new")e.preventDefault();});
document.addEventListener("drop",function(e){
  if(S.view!=="new"||!draft)return;
  e.preventDefault();addFiles(Array.from(e.dataTransfer.files||[]));
});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("lightbox").hidden=true;});

const importer=document.createElement("input");
importer.type="file";importer.accept="application/json";importer.id="importer";importer.style.display="none";
importer.addEventListener("change",function(){
  const file=importer.files[0];if(!file)return;
  const fr=new FileReader();
  fr.onload=function(){try{const s=JSON.parse(fr.result);
    if(Array.isArray(s.trades)){
      if(s.shots)Object.keys(s.shots).forEach(function(id){SHOTS[id]=s.shots[id];IDB.set(id,s.shots[id]).catch(function(){});});
      S.trades=s.trades;S.startBalance=s.startBalance!=null?s.startBalance:S.startBalance;if(s.name)S.name=s.name;
      save();render();startTicker();alert(s.trades.length+" Trades importiert.");}}
    catch(err){alert("Datei konnte nicht gelesen werden.");}};
  fr.readAsText(file);
});
document.body.appendChild(importer);

load();applyTheme();render();startTicker();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
</script>
</body>
</html>
